[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "/usr/src/app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "whatsapp-bot"

[[services]]
name = "socket-server"
dockerfile = "Dockerfile.socket-server"
# startCommand matches the global one: /usr/src/app/start.sh

# Volume configuration for session persistence
[[volumes]]
name = "whatsapp_data"
path = "/data"
